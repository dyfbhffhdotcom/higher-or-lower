<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Higher or Lower</title>
<style>
:root{--bg:#111;--card:#1b1b1b;--red:#e53935;--blue:#1e88e5;--green:#43a047}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eee;font-family:system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;gap:10px;flex-wrap:wrap}
h1{margin:0;font-style:italic;font-size:30px}.pill{border:2px solid var(--red);border-radius:20px;padding:6px 14px;font-weight:700;margin-left:6px}
.wrap{padding:0 20px 20px}.scale{display:flex;justify-content:space-between;color:var(--red);font-weight:700;margin:6px 0}
.beam{border-top:2px solid #ddd;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:center}
.it{width:96px;text-align:center;font-size:11px;font-weight:700;position:relative}
.it .im{width:72px;height:72px;margin:0 auto 4px;border:2px solid var(--red);background:#222;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:10px}
.im img{width:100%;height:100%;image-rendering:pixelated}.it.start .im{border-color:gold}.it.bad .im{border-color:#f55;background:#3a1515}
.val{color:#ffa060}.val.dim{color:#777}.it.sel .im{border-color:#4cf;box-shadow:0 0 10px #4cf}
.adm .pool .it{cursor:grab}.gap{width:30px;height:72px;border:2px dashed #444;border-radius:6px;background:none;color:#666;cursor:default}
.adm .gap{border-color:#888;cursor:pointer}.gap.over{border-color:#4cf;background:#123}
.turn{text-align:center;font-size:20px;font-weight:700;margin:6px 0 14px}
.players{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.pl{background:var(--card);border:3px solid #444;border-radius:8px;padding:8px 14px;min-width:140px}
.red{border-color:var(--red)}.blue{border-color:var(--blue)}.green{border-color:var(--green)}
.heart{color:#ff2d8f}.lost{color:#444}.pl small{color:#aaa}
button.b{background:#333;color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:700;margin:2px}
button.b:hover{background:#555}button.b:disabled{opacity:.3}button.b.d{background:#7a1c1c}
.join{max-width:380px;margin:60px auto;background:var(--card);padding:24px;border-radius:12px}
.join input{width:100%;padding:10px;font-size:16px;border-radius:6px;border:0;margin:10px 0}
.tb{display:flex;gap:8px}.tb button{flex:1;padding:12px;border:3px solid #444;border-radius:8px;color:#fff;background:#222;cursor:pointer;font-weight:700}
.tb button.on.red{background:var(--red)}.tb button.on.blue{background:var(--blue)}.tb button.on.green{background:var(--green)}
.teams{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}.tm{padding:6px 14px;border-radius:6px;font-weight:700;border:3px solid transparent}
.tm.red{background:var(--red)}.tm.blue{background:var(--blue)}.tm.green{background:var(--green)}.tm.on{border-color:#fff}.adm .tm{cursor:pointer}
.panel{background:var(--card);border-radius:8px;padding:10px;margin:12px 0}.panel table{width:100%;border-collapse:collapse}.panel td{padding:3px 6px}
</style></head><body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const token = localStorage.hol_t || (localStorage.hol_t = Math.random().toString(36).slice(2) + Date.now());
const TEAM = { red: 'Rot', blue: 'Blau', green: 'Grün' };
let S = null, isAdmin = false, pickTeam = localStorage.hol_team || '', sel = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const adm = (a, o = {}) => socket.emit('admin', { a, ...o });
socket.on('connect', () => socket.emit('hello', token));
socket.on('state', s => { S = s; isAdmin = s.admin; if (!S.pool.includes(sel)) sel = null; render(); });
socket.on('adminFail', () => alert('Falsches Passwort'));
function adminLogin() { const pw = prompt('Admin-Passwort'); if (pw) socket.emit('auth', pw); }
function join() {
  const name = document.getElementById('nm').value.trim();
  if (!name || !pickTeam) return alert('Name und Team wählen');
  localStorage.hol_team = pickTeam; localStorage.hol_name = name;
  socket.emit('join', { token, name, team: pickTeam });
}
function setTeam(t) { pickTeam = t; const v = document.getElementById('nm').value; localStorage.hol_name = v; render(); }
function tile(it, cls = '') {
  const im = it.img ? `<img src="${esc(it.img)}" alt="" onerror="this.replaceWith(document.createTextNode(this.alt))">` : esc(it.name);
  const val = it.value != null ? `<div class="val ${it.pub ? '' : 'dim'}">${it.value}</div>` : '';
  return `<div class="it ${cls}" data-id="${it.id}"><div class="im">${im}</div>${esc(it.name)}${val}</div>`;
}
function place(id, gap) { if (id) { adm('place', { id, gap }); sel = null; } }
function setP(t, pts, h) { adm('setPlayer', { token: t, points: pts, hearts: h }); }
function editP(t, pts, h) {
  const p = prompt('Punkte setzen:', pts); if (p === null) return;
  const hh = prompt('Herzen (0-2):', h); if (hh === null) return;
  setP(t, Number(p), Number(hh));
}
function render() {
  const app = document.getElementById('app');
  if (!S) return;
  if (!S.me && !isAdmin) {
    app.innerHTML = `<div class="join"><h1>Higher or Lower</h1>
      <input id="nm" placeholder="Dein Name" maxlength="20" value="${esc(localStorage.hol_name || '')}">
      <div class="tb">${Object.keys(TEAM).map(t => `<button class="${t} ${pickTeam === t ? 'on' : ''}" onclick="setTeam('${t}')">${TEAM[t]}</button>`).join('')}</div>
      <p><button class="b" onclick="join()">Beitreten</button> <button class="b" onclick="adminLogin()">Admin</button></p></div>`;
    return;
  }
  const byId = Object.fromEntries(S.items.map(i => [i.id, i]));
  const start = S.items.find(i => i.pub && !S.resolved)?.id;
  let row = '';
  for (let g = 0; g <= S.placed.length; g++) {
    row += `<button class="gap" data-g="${g}"></button>`;
    if (g < S.placed.length) { const id = S.placed[g]; row += tile(byId[id], (id === start ? 'start ' : '') + (S.wrong.includes(id) ? 'bad' : '')); }
  }
  const teamsIn = [...new Set(S.players.map(p => p.team))];
  const teams = teamsIn.map(t => `<span class="tm ${t} ${S.turn === t ? 'on' : ''}" data-t="${t}">${TEAM[t]}: ${S.players.filter(p => p.team === t).reduce((a, p) => a + p.points, 0)}</span>`).join('');
  const hearts = h => [0, 1].map(i => `<span class="${i < h ? 'heart' : 'lost'}">♥</span>`).join('');
  const players = S.players.map(p => `<div class="pl ${p.team}"><b>${esc(p.name)}</b><br>${hearts(p.hearts)} <small>${p.points} Pkt</small></div>`).join('');
  const manage = isAdmin ? `<div class="panel"><b>Spieler verwalten</b><table>${S.players.map(p => `<tr><td class="${p.team}" style="border-left:4px solid">${esc(p.name)}</td>
    <td>${hearts(p.hearts)} <button class="b" onclick="setP('${p.token}',${p.points},${p.hearts - 1})">♥−</button><button class="b" onclick="setP('${p.token}',${p.points},${p.hearts + 1})">♥+</button></td>
    <td>${p.points} Pkt <button class="b" onclick="setP('${p.token}',${p.points - 5},${p.hearts})">−5</button><button class="b" onclick="setP('${p.token}',${p.points - 1},${p.hearts})">−1</button><button class="b" onclick="setP('${p.token}',${p.points + 1},${p.hearts})">+1</button><button class="b" onclick="setP('${p.token}',${p.points + 5},${p.hearts})">+5</button><button class="b" onclick="editP('${p.token}',${p.points},${p.hearts})">✎</button></td>
    <td><button class="b d" onclick="confirm('Spieler entfernen?')&&adm('kick',{token:'${p.token}'})">✕</button></td></tr>`).join('')}</table></div>` : '';
  const ctl = isAdmin ? `<div class="panel">
    <button class="b" onclick="adm('start')">${S.phase === 'lobby' ? 'Spiel starten' : 'Neu starten'}</button>
    <button class="b" onclick="adm('undo')" ${S.canUndo ? '' : 'disabled'}>↶ Rückgängig</button>
    <button class="b" onclick="adm('resolve')" ${S.phase === 'playing' && !S.resolved ? '' : 'disabled'}>Board auflösen</button>
    <button class="b" onclick="adm('endBoard')" ${S.phase === 'playing' ? '' : 'disabled'}>Board beenden (Punkte)</button>
    <button class="b d" onclick="confirm('Alles zurücksetzen?')&&adm('reset')">Reset</button><br>
    <small>Item unten anklicken/ziehen, dann auf die Lücke im Strahl klicken/ablegen · Team-Chip anklicken = Team am Zug ändern</small></div>`
    : `<p><button class="b" onclick="adminLogin()">Admin</button></p>`;
  const rank = S.ranking ? `<div class="panel">Letztes Board: ${S.ranking.map(r => `${esc(r.name)} (${r.hearts}♥)`).join(', ')}</div>` : '';
  const lastTxt = S.last ? `<div class="turn" style="color:${S.last.correct ? '#6f6' : '#f66'}">${esc(S.last.name)}: ${S.last.correct ? 'richtig platziert' : 'falsch – zurück in den Pool, Team ' + TEAM[S.last.team] + ' verliert ein Herz'}</div>` : '';
  const turnTxt = S.phase === 'playing' && S.turn ? `<div class="turn"><span class="tm ${S.turn}">Am Zug: Team ${TEAM[S.turn]}</span></div>` : '';
  app.innerHTML = `<header><h1>HIGHER OR LOWER</h1><div><span class="pill">Runde ${S.round}/${S.total}</span><span class="pill">${esc(S.category)}</span>${S.label ? `<span class="pill">${esc(S.label)}</span>` : ''}</div></header>
  <div class="wrap ${isAdmin ? 'adm' : ''}">
    <div class="scale"><span>Low</span><span>High</span></div><div class="beam"></div>
    ${lastTxt}${S.phase === 'lobby' ? '<p>Warte auf den Start durch den Admin …</p>' : S.phase === 'finished' ? '<h2 style="text-align:center">Spiel beendet!</h2>' : turnTxt}
    <div class="row">${S.phase === 'lobby' ? '' : row}</div>
    <h3>Noch offen</h3><div class="row pool">${S.pool.map(id => tile(byId[id], sel === id ? 'sel' : '')).join('') || '<small>alles platziert</small>'}</div>
    <div class="teams">${teams}</div>${rank}${ctl}${manage}<div class="players">${players}</div></div>`;
  if (!isAdmin) return;
  app.querySelectorAll('.tm').forEach(el => el.onclick = () => adm('setTurn', { team: el.dataset.t }));
  app.querySelectorAll('.pool .it').forEach(el => {
    el.draggable = true;
    el.onclick = () => { sel = sel === el.dataset.id ? null : el.dataset.id; render(); };
    el.ondragstart = e => e.dataTransfer.setData('text/plain', el.dataset.id);
  });
  app.querySelectorAll('.gap').forEach(el => {
    const g = Number(el.dataset.g);
    el.onclick = () => place(sel, g);
    el.ondragover = e => { e.preventDefault(); el.classList.add('over'); };
    el.ondragleave = () => el.classList.remove('over');
    el.ondrop = e => { e.preventDefault(); place(e.dataTransfer.getData('text/plain'), g); };
  });
}
</script></body></html>
